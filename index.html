<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>E-Learning Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
    }

    /* Navbar container */
    .navbar {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #333;
      padding: 1rem;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
    }

    .navbar a {
      color: white;
      text-decoration: underline;
      margin: 0 15px;
      font-size: 16px;
      transition: color 0.3s;
    }

    .navbar a:hover {
      color: #00aced;
    }

    /* Profile button styles */
    .profile-container {
      position: absolute;
      right: 40px;
      top: 8px;
    }

    .profile-button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid white;
    }

    .profile-button img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .profile-button.expanded {
      width: 100px;
      height: 100px;
    }

    .main-content {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background-color: navy;
      color: white;
      font-size: 4rem;
      font-weight: bold;
      padding-top: 60px;
    }

    /* Next Page Button */
    .next-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #007BFF;
      color: white;
      padding: 12px 18px;
      font-size: 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: underline;
      transition: background-color 0.3s ease;
    }

    .next-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <div class="navbar">
    <a href="test.html">Home</a>
    <a href="login.html">Login</a>
    <a href="Courses.html">Courses</a>
    <a href="Quiz.html">Quiz</a>
    <a href="Feedback.html">Feedback</a>
    <div class="profile-container">
      <div class="profile-button" onclick="toggleProfile()">
        <img src="img1.png" alt="Profile" />
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    Learn today!!
  </div>

  <!-- Next Page Button -->
  <a href="login.html" class="next-button">Next Page</a>

  <script>
    function toggleProfile() {
      const profile = document.querySelector('.profile-button');
      profile.classList.toggle('expanded');
    }
  </script>

</body>
</html>
