<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Website Feedback</title>
  <style>      
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    .feedback-container {
      margin: 80px auto;
      background: #ffffff;
      max-width: 500px;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .feedback-container h2 {
      color: #222;
      margin-bottom: 10px;
    }

    .feedback-container p {
      color: #555;
      font-size: 14px;
    }

    .stars {
      margin: 20px 0;
    }

    .star {
      font-size: 28px;
      color: #ccc;
      cursor: pointer;
      transition: color 0.3s;
    }

    .star.selected {
      color: #f7c400;
    }

    textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      margin-top: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: none;
      font-size: 14px;
    }

    .submit-btn {
      background-color:  #2d89cc;
      color: white;
      border: none;
      padding: 14px 36px;
      border-radius: 50px; /* Full round */
      font-size: 15px;
      cursor: pointer;
      margin-top: 20px;
    }

    .submit-btn:hover {
      background-color:  #2f64a9;
    }

    .success-message {
      margin-top: 20px;
      background-color: #28a745;
      color: white;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }

    .nav-buttons {
      position: fixed;
      bottom: 20px;
      left: 20px;
    }

    .nav-buttons a {
      text-decoration: underline;
      color: #000;
      background-color: #ffffff;
      border: 1px solid #ccc;
      padding: 8px 16px;
      border-radius:  10px; /* Square-rounded */
      font-size: 14px;
    }

    .nav-buttons a:hover {
      background-color: #e6e6e6;
      color: #000;
    }
  </style>
</head>
<body>

  <div class="feedback-container">
    <h2>We value your Feedback</h2>
    <p>Let us know how we can improve your experience.</p>

    <h3>Rate Your Experience</h3>
    <div class="stars" id="stars">
      <span class="star" data-value="1">&#9733;</span>
      <span class="star" data-value="2">&#9733;</span>
      <span class="star" data-value="3">&#9733;</span>
      <span class="star" data-value="4">&#9733;</span>
      <span class="star" data-value="5">&#9733;</span>
    </div>

    <h3>What Can We Improve?</h3>
    <textarea placeholder="Your suggestions or comments..."></textarea>
    <br>
    <button class="submit-btn" onclick="submitFeedback()">Submit Feedback</button>

    <div class="success-message" id="successMessage">
      Thank you for your feedback!
    </div>
  </div>

  <div class="nav-buttons">
    <a href="Quiz.html">Previous Page</a>
  </div>

  <script>
    const stars = document.querySelectorAll('.star');
    stars.forEach(star => {
      star.addEventListener('click', () => {
        stars.forEach(s => s.classList.remove('selected'));
        const value = parseInt(star.dataset.value);
        for (let i = 0; i < value; i++) {
          stars[i].classList.add('selected');
        }
      });
    });

    function submitFeedback() {
      document.getElementById("successMessage").style.display = "block";
    }
  </script>
</body>
</html>
